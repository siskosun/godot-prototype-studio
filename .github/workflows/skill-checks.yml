name: Skill checks
on:
  push:
    branches: [main, 'upgrade/**', 'gps-1.0-alignment']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  utilities:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare Python
        run: python -m pip install Pillow==11.3.0 PyYAML==6.0.2
      - name: Utility regression
        run: python -m unittest discover -s tests -v
      - name: Build runtime skill package
        run: python scripts/build_skill_package.py --out skill.zip
      - name: Upload runtime skill package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: skill-${{ matrix.os }}-${{ github.sha }}
          path: skill.zip
          retention-days: 7
          if-no-files-found: error

  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Capture exact tracked source and provenance
        run: |
          git archive --format=zip --prefix=godot-prototype-studio/ HEAD > "${RUNNER_TEMP}/source.zip"
          git rev-parse HEAD > "${RUNNER_TEMP}/commit.txt"
          git rev-parse HEAD^{tree} > "${RUNNER_TEMP}/tree.txt"
          sha256sum "${RUNNER_TEMP}/source.zip" > "${RUNNER_TEMP}/archive-sha256.txt"
      - name: Retain source provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: source-provenance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/source.zip
            ${{ runner.temp }}/commit.txt
            ${{ runner.temp }}/tree.txt
            ${{ runner.temp }}/archive-sha256.txt
          retention-days: 7
          if-no-files-found: error
